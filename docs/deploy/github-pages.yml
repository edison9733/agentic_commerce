# A GitHub Actions workflow that builds the site and publishes it to GitHub Pages.
#
# It is kept here, not in .github/workflows/, because the session that wrote it
# had no permission to add workflows to the repository. To use it:
#
#   1. Repository Settings -> Pages -> Build and deployment -> Source: GitHub Actions.
#   2. Copy this file to .github/workflows/pages.yml and commit it.
#   3. Actions -> "Deploy site" -> Run workflow.
#
# The site is static and reads Solana devnet from the browser. The Market page
# also needs the agents server; without one it says so.
name: Deploy site

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:web
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
