[package]
name = "tessera-paylater"
version = "0.1.0"
description = "Tessera pay-later: buy now, pay later for AI agents, with a credit limit set by the Tessera score"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "tessera_paylater"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "=1.1.2", features = ["init-if-needed"] }
anchor-spl = { version = "=1.1.2", features = ["token", "associated_token"] }
# Read-only: the escrow program's credit files and config, and its score formula.
tessera = { path = "../tessera", features = ["no-entrypoint"] }
