[package]
name = "tessera"
version = "0.1.0"
description = "Tessera: x402 escrow with an on-chain credit score that sets settlement speed"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "tessera"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "=1.1.2", features = ["init-if-needed"] }
anchor-spl = { version = "=1.1.2", features = ["token", "associated_token"] }
